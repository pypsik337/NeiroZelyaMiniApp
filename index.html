<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>НейроЗеле</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root{
        /* палитра вдохновлена петриковской росписью и вышиванкой:
           чорнозем, обожжённая глина, маковый цвет, пшеничное золото, вишня */
        --bg-1:#170d09;
        --bg-2:#3d1912;
        --bg-3:#7a2a17;
        --accent-1:#e0522a;
        --accent-2:#eab649;
        --cherry:#9c2036;
        --leaf:#5c8a42;
        --glass:rgba(255,247,232,0.08);
        --glass-strong:rgba(255,247,232,0.15);
        --ink:#fbf2e2;
        --ink-dim:#dcc09a;
        --outline:rgba(12,6,4,0.8);
        --stitch: 12px;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{ height:100%; }
    body{
        margin:0; padding:0;
        font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color:var(--ink);
        display:flex; flex-direction:column; height:100vh; overflow:hidden;
        background:linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
        background-size:300% 300%;
        animation:gradientShift 18s ease infinite;
        position:relative;
    }
    @keyframes gradientShift{
        0%{background-position:0% 30%;}
        50%{background-position:100% 70%;}
        100%{background-position:0% 30%;}
    }

    /* декоративные пятна фона — как разводы природных красок на полотне */
    .blob{
        position:fixed; border-radius:50%; filter:blur(55px);
        pointer-events:none; z-index:0; opacity:0.45;
    }
    .blob-1{ width:260px; height:260px; background:var(--accent-1); top:-60px; left:-60px; animation:floatBlob 14s ease-in-out infinite; }
    .blob-2{ width:220px; height:220px; background:var(--accent-2); bottom:120px; right:-70px; animation:floatBlob 17s ease-in-out infinite reverse; }
    .blob-3{ width:180px; height:180px; background:var(--cherry); top:40%; left:60%; animation:floatBlob 20s ease-in-out infinite; }
    @keyframes floatBlob{
        0%,100%{ transform:translate(0,0) scale(1); }
        33%{ transform:translate(30px,-20px) scale(1.1); }
        66%{ transform:translate(-20px,25px) scale(0.95); }
    }

    /* ===== ВЫШИВАНКА: повторяющаяся тесьма из ромбов, как отделка рушника ===== */
    .stitch-trim{
        height:var(--stitch);
        background-image:
            linear-gradient(135deg, var(--accent-1) 25%, transparent 25%, transparent 75%, var(--accent-1) 75%),
            linear-gradient(45deg, var(--accent-1) 25%, transparent 25%, transparent 75%, var(--accent-1) 75%),
            linear-gradient(135deg, var(--bg-1) 25%, transparent 25%, transparent 75%, var(--bg-1) 75%),
            linear-gradient(45deg, var(--bg-1) 25%, transparent 25%, transparent 75%, var(--bg-1) 75%);
        background-size: var(--stitch) var(--stitch);
        background-position: 0 0, calc(var(--stitch)/2) calc(var(--stitch)/2), 0 0, calc(var(--stitch)/2) calc(var(--stitch)/2);
        opacity:0.85;
        flex-shrink:0;
    }

    h1,h2,h3{ font-family:'Yeseva One', serif; margin:0; }

    #app{ flex:1; position:relative; overflow:hidden; z-index:1; }
    .page{
        position:absolute; top:0; left:0; width:100%; height:100%;
        display:none; flex-direction:column; padding:18px; padding-bottom:78px;
        overflow-y:auto; opacity:0; transform:translateY(8px);
    }
    .page.active{ display:flex; animation:pageIn .35s ease forwards; }
    @keyframes pageIn{ to{ opacity:1; transform:translateY(0);} }

    /* ===== ГЛАВНЫЙ ЭКРАН ===== */
    #page-home{ align-items:center; justify-content:center; text-align:center; gap:18px; position:relative; }
    .support-btn{
        position:absolute; top:10px; right:10px; z-index:2;
        display:flex; align-items:center; gap:5px;
        padding:8px 11px; border-radius:12px;
        border:1.5px solid var(--outline);
        background:linear-gradient(135deg, var(--cherry), var(--accent-1));
        color:#fff; text-decoration:none;
        font-size:11.5px; font-weight:700; font-family:'Nunito', sans-serif;
        box-shadow:0 4px 14px rgba(0,0,0,0.35);
        transition:transform .12s ease, filter .12s ease;
        line-height:1.3; max-width:100px; text-align:left;
    }
    .support-btn:active{ transform:scale(0.95); filter:brightness(1.1); }
    .support-btn .heart{ font-size:15px; flex-shrink:0; animation:heartBeat 1.6s ease-in-out infinite; }
    @keyframes heartBeat{
        0%,100%{ transform:scale(1); }
        50%{ transform:scale(1.15); }
    }
    .flower-medallion{
        width:132px; height:132px;
        filter:drop-shadow(0 0 26px rgba(224,82,42,0.55));
        animation:pulseOrb 3.6s ease-in-out infinite;
    }
    @keyframes pulseOrb{
        0%,100%{ transform:scale(1) rotate(0deg); }
        50%{ transform:scale(1.05) rotate(1.5deg); }
    }
    .welcome-bubble{
        background:var(--glass);
        backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
        border:1.5px solid rgba(255,247,232,0.22);
        padding:22px 26px; border-radius:22px; border-bottom-left-radius:6px;
        font-family:'Yeseva One', serif; font-size:23px; font-weight:600;
        max-width:82%; box-shadow:0 8px 30px rgba(0,0,0,0.35);
        animation:fadeInUp .5s ease .1s both;
    }
    .welcome-sub{ color:var(--ink-dim); font-size:14px; max-width:80%; animation:fadeInUp .5s ease .25s both; }
    .welcome-divider{ width:96px; border-radius:4px; overflow:hidden; animation:fadeInUp .5s ease .35s both; }

    /* ===== ЭКРАН ЧАТА ===== */
    #page-chat{ padding:0 0 78px 0; }
    #chat-messages{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:16px; }
    .msg{
        padding:11px 15px; border-radius:18px; max-width:78%; line-height:1.45; font-size:15px;
        word-break:break-word; animation:fadeInUp .35s ease both; box-shadow:0 4px 14px rgba(0,0,0,0.25);
    }
    @keyframes fadeInUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
    .msg-user{
        background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color:#fff; align-self:flex-end; border-bottom-right-radius:5px;
    }
    .msg-bot{
        background:var(--glass-strong); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
        border:1px solid rgba(255,247,232,0.16);
        color:var(--ink); align-self:flex-start; border-bottom-left-radius:5px;
    }
    .typing{ align-self:flex-start; display:flex; gap:5px; padding:13px 16px; }
    .typing span{
        width:7px; height:7px; border-radius:50%; background:var(--ink-dim);
        animation:typingBounce 1.1s infinite ease-in-out;
    }
    .typing span:nth-child(2){ animation-delay:.15s; }
    .typing span:nth-child(3){ animation-delay:.3s; }
    @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.5;} 30%{ transform:translateY(-5px); opacity:1;} }

    .chat-input-area{
        display:flex; gap:8px; padding:12px;
        background:rgba(23,13,9,0.4);
        backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
        border-top:1px solid rgba(255,247,232,0.12);
        position:relative;
    }
    .chat-input-area::before{
        content:'';
        position:absolute; top:calc(-1 * var(--stitch)); left:0; width:100%; height:var(--stitch);
        background-image:
            linear-gradient(135deg, var(--accent-1) 25%, transparent 25%, transparent 75%, var(--accent-1) 75%),
            linear-gradient(45deg, var(--accent-1) 25%, transparent 25%, transparent 75%, var(--accent-1) 75%),
            linear-gradient(135deg, var(--bg-1) 25%, transparent 25%, transparent 75%, var(--bg-1) 75%),
            linear-gradient(45deg, var(--bg-1) 25%, transparent 25%, transparent 75%, var(--bg-1) 75%);
        background-size: var(--stitch) var(--stitch);
        background-position: 0 0, calc(var(--stitch)/2) calc(var(--stitch)/2), 0 0, calc(var(--stitch)/2) calc(var(--stitch)/2);
        opacity:0.7;
    }
    .chat-input-area input{
        flex:1; padding:13px 16px; border-radius:14px;
        border:1.5px solid var(--outline);
        background:rgba(255,247,232,0.09); color:var(--ink);
        outline:none; font-size:16px;
    }
    .chat-input-area input::placeholder{ color:var(--ink-dim); }
    .chat-input-area button{
        padding:13px 20px; border:1.5px solid var(--outline); border-radius:14px;
        background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
        color:#fff; font-weight:700; cursor:pointer; font-size:15px; font-family:'Yeseva One',serif;
        transition:transform .12s ease, filter .12s ease;
    }
    .chat-input-area button:active{ transform:scale(0.94); filter:brightness(1.1); }

    /* ===== ЭКРАН НАСТРОЕК ===== */
    #page-settings{ gap:14px; }
    #page-settings h2{ font-size:22px; margin-bottom:4px; }
    .settings-btn{
        width:100%; padding:17px 18px; border:1.5px solid var(--outline); border-radius:16px;
        background:var(--glass); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
        color:var(--ink); font-size:15.5px; font-weight:600; text-align:left; cursor:pointer;
        display:flex; justify-content:space-between; align-items:center;
        transition:transform .12s ease, background .2s ease;
    }
    .settings-btn:active{ transform:scale(0.97); background:var(--glass-strong); }
    .settings-hint{
        font-size:12.5px; color:var(--ink-dim); padding:0 6px; line-height:1.5;
    }

    /* ===== МОДАЛЬНОЕ ОКНО ===== */
    #prompt-modal{
        position:fixed; top:0; left:0; width:100%; height:100%;
        background:rgba(8,5,20,0.6); backdrop-filter:blur(4px);
        display:none; justify-content:center; align-items:center; z-index:100;
    }
    #prompt-modal.active{ display:flex; animation:fadeInUp .25s ease; }
    .modal-content{
        background:linear-gradient(160deg, rgba(122,42,23,0.92), rgba(23,13,9,0.96));
        border:1.5px solid var(--outline);
        padding:22px; border-radius:20px; width:88%; max-width:400px;
        display:flex; flex-direction:column; gap:14px;
        box-shadow:0 15px 50px rgba(0,0,0,0.5);
        animation:popIn .3s cubic-bezier(.2,.8,.3,1.2);
    }
    @keyframes popIn{ from{ opacity:0; transform:scale(0.9);} to{ opacity:1; transform:scale(1);} }
    .modal-content h3{ font-size:18px; }
    .modal-content p{ margin:0; }
    .modal-content textarea{
        width:100%; height:100px; padding:12px; border-radius:12px;
        border:1.5px solid var(--outline);
        background:rgba(255,247,232,0.09); color:var(--ink);
        font-family:inherit; font-size:14px; resize:none; outline:none;
    }
    .modal-content textarea::placeholder{ color:var(--ink-dim); }
    .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
    .modal-btn{
        padding:11px 16px; border-radius:12px; border:1.5px solid var(--outline);
        font-weight:700; cursor:pointer; font-family:'Yeseva One',serif; font-size:14px;
        transition:transform .12s ease;
    }
    .modal-btn:active{ transform:scale(0.94); }
    .btn-cancel{ background:rgba(255,247,232,0.09); color:var(--ink); }
    .btn-save{ background:linear-gradient(135deg, var(--accent-1), var(--accent-2)); color:#fff; }

    /* ===== TOAST ===== */
    #toast{
        position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-40px);
        background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
        border:1.5px solid var(--outline);
        color:#fff; padding:11px 20px; border-radius:14px; font-weight:700; font-size:14px;
        font-family:'Yeseva One',serif; box-shadow:0 8px 24px rgba(0,0,0,0.4);
        opacity:0; z-index:200; pointer-events:none; transition:transform .3s ease, opacity .3s ease;
    }
    #toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

    /* ===== НИЖНЕЕ МЕНЮ ===== */
    .bottom-nav{
        position:fixed; bottom:0; left:0; width:100%; height:64px;
        background:rgba(23,13,9,0.6);
        backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
        border-top:1.5px solid var(--outline);
        display:flex; justify-content:space-around; align-items:center;
        z-index:10; padding-bottom:env(safe-area-inset-bottom);
    }
    .bottom-nav::before{
        content:'';
        position:absolute; top:calc(-1 * var(--stitch)); left:0; width:100%; height:var(--stitch);
        background-image:
            linear-gradient(135deg, var(--accent-1) 25%, transparent 25%, transparent 75%, var(--accent-1) 75%),
            linear-gradient(45deg, var(--accent-1) 25%, transparent 25%, transparent 75%, var(--accent-1) 75%),
            linear-gradient(135deg, var(--bg-1) 25%, transparent 25%, transparent 75%, var(--bg-1) 75%),
            linear-gradient(45deg, var(--bg-1) 25%, transparent 25%, transparent 75%, var(--bg-1) 75%);
        background-size: var(--stitch) var(--stitch);
        background-position: 0 0, calc(var(--stitch)/2) calc(var(--stitch)/2), 0 0, calc(var(--stitch)/2) calc(var(--stitch)/2);
    }
    .nav-item{
        flex:1; height:100%; text-align:center; background:none; border:none;
        color:var(--ink-dim); cursor:pointer; padding:8px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        transition:color .2s ease;
    }
    .nav-item .icon-wrap{
        width:34px; height:34px; border-radius:12px; display:flex; align-items:center; justify-content:center;
        transition:background .25s ease, transform .25s ease; border:1.5px solid transparent;
    }
    .nav-item.active{ color:var(--ink); }
    .nav-item.active .icon-wrap{
        background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
        border:1.5px solid var(--outline);
        transform:translateY(-2px);
        box-shadow:0 4px 14px rgba(139,92,246,0.5);
    }
    .icon{ font-size:18px; }
    .nav-label{ font-size:10.5px; font-weight:700; font-family:'Yeseva One',serif; }

    ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div id="app">

    <!-- 1. Главный экран -->
    <div id="page-home" class="page active">
        <a class="support-btn" href="https://www.portmone.com.ua/r3/podderzhi-ukrainskuyu-armiyu" target="_blank" rel="noopener noreferrer" onclick="return openSupportLink(event)">
            <span class="heart">🇺🇦</span>
            <span>Поддержать наших ВСУ</span>
        </a>
        <svg class="flower-medallion" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
            <!-- стебель и усики, как в петриковской росписи -->
            <path d="M70 128 C 66 100, 74 80, 70 66" stroke="var(--leaf)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M70 100 C 55 96, 48 84, 52 74" stroke="var(--leaf)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M70 100 C 85 96, 92 84, 88 74" stroke="var(--leaf)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- листья -->
            <path d="M52 74 C 40 70, 34 78, 38 88 C 46 86, 52 80, 52 74 Z" fill="var(--leaf)"/>
            <path d="M88 74 C 100 70, 106 78, 102 88 C 94 86, 88 80, 88 74 Z" fill="var(--leaf)"/>
            <!-- ягоды -->
            <circle cx="46" cy="92" r="4" fill="var(--cherry)"/>
            <circle cx="94" cy="92" r="4" fill="var(--cherry)"/>
            <circle cx="70" cy="118" r="4.5" fill="var(--cherry)"/>
            <!-- центральный цветок -->
            <g transform="translate(70 52)">
                <ellipse rx="26" ry="26" fill="var(--accent-1)"/>
                <path d="M0 -26 C 14 -22, 22 -10, 22 0 C 22 10, 14 20, 0 26 C -14 20, -22 10, -22 0 C -22 -10, -14 -22, 0 -26 Z"
                      fill="none" stroke="var(--accent-2)" stroke-width="2.5" opacity="0.85"/>
                <circle r="15" fill="var(--accent-2)"/>
                <circle r="7" fill="var(--bg-1)"/>
                <g stroke="var(--bg-1)" stroke-width="2" stroke-linecap="round">
                    <line x1="0" y1="-7" x2="0" y2="-11"/>
                    <line x1="0" y1="7" x2="0" y2="11"/>
                    <line x1="-7" y1="0" x2="-11" y2="0"/>
                    <line x1="7" y1="0" x2="11" y2="0"/>
                </g>
            </g>
        </svg>
        <div class="welcome-bubble">Вітаю,<br>Як справи?</div>
        <div class="welcome-divider stitch-trim"></div>
        <div class="welcome-sub">Я НейроЗеля - твой собеседник, давай пообщаемся? :3</div>
    </div>

    <!-- 2. Экран чата -->
    <div id="page-chat" class="page">
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="введите сообщение.." onkeydown="if(event.key==='Enter') send()" />
            <button onclick="send()">➤</button>
        </div>
    </div>

    <!-- 3. Экран настроек -->
    <div id="page-settings" class="page">
        <h2>Настройки ИИ</h2>
        <p id="promptStatus" class="settings-hint" style="margin:-6px 0 2px 6px;">Загружаю статус…</p>
        <button class="settings-btn" onclick="openPromptModal()">
            Задать свой промпт НейроЗеле <span>➡️</span>
        </button>
        <button class="settings-btn" onclick="resetPrompt()">
            Вернуть стандартный промпт <span>🔄</span>
        </button>
        <p class="settings-hint">Возвращает стандартный промпт для ИИ, который прописан в коде бэкенда.</p>
    </div>

</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="prompt-modal">
    <div class="modal-content">
        <div class="stitch-trim" style="border-radius:3px; margin:-6px -6px 0 -6px;"></div>
        <h3>Ваш промпт</h3>
        <p style="font-size:12px; color:var(--ink-dim);">например «Будь кавайной няшкой»</p>
        <textarea id="customPromptInput" placeholder="Впишите сюда роль для ИИ..."></textarea>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closePromptModal()">Отмена</button>
            <button class="modal-btn btn-save" onclick="saveCustomPrompt()">Сохранить</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<!-- НИЖНЕЕ МЕНЮ -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="navigateTo('home')">
        <span class="icon-wrap"><span class="icon">🌻</span></span>
        <span class="nav-label">Главная</span>
    </button>
    <button class="nav-item" onclick="navigateTo('chat')">
        <span class="icon-wrap"><span class="icon">💬</span></span>
        <span class="nav-label">Чат</span>
    </button>
    <button class="nav-item" onclick="navigateTo('settings')">
        <span class="icon-wrap"><span class="icon">🎨</span></span>
        <span class="nav-label">Роль</span>
    </button>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ВАЖНО: укажи здесь публичный адрес твоего Flask-бэкенда
    // (например, после деплоя на Render/Railway).
    // Если фронтенд и бэкенд будут на одном домене — оставь пустую строку.
    const API_BASE = '';

    const userId = tg.initDataUnsafe?.user?.id;
    let chatHistory = [];
    let currentCustomPrompt = null;

    // Подтягиваем актуальный промпт с сервера при открытии (он там хранится
    // постоянно, поэтому переживает закрытие/переоткрытие Mini App)
    async function syncPromptFromServer(){
        const statusEl = document.getElementById('promptStatus');
        try{
            const res = await fetch(`${API_BASE}/api/prompt?user_id=${userId}`);
            const data = await res.json();
            if (res.status !== 200){
                statusEl.textContent = data.error || 'Не удалось загрузить статус';
                return;
            }
            currentCustomPrompt = data.custom_prompt || null;
            updatePromptStatus();
        } catch(err){
            statusEl.textContent = 'Нет связи с сервером';
        }
    }

    function updatePromptStatus(){
        const statusEl = document.getElementById('promptStatus');
        statusEl.textContent = currentCustomPrompt
            ? 'Сейчас активен: твой собственный промпт'
            : 'Сейчас активен: стандартный промпт';
    }

    syncPromptFromServer();

    // --- НАВИГАЦИЯ ---
    function openSupportLink(e){
        e.preventDefault();
        const url = 'https://www.portmone.com.ua/r3/podderzhi-ukrainskuyu-armiyu';
        if (tg.openLink){
            tg.openLink(url);
        } else {
            window.open(url, '_blank');
        }
        return false;
    }

    function navigateTo(pageId){
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById(`page-${pageId}`).classList.add('active');
        const navIndex = { home:0, chat:1, settings:2 }[pageId];
        document.querySelectorAll('.nav-item')[navIndex].classList.add('active');

        if (pageId === 'chat'){
            setTimeout(() => {
                document.getElementById('msgInput').focus();
                scrollToBottom();
            }, 100);
        }
        tg.HapticFeedback?.impactOccurred('light');
    }

    // --- ЧАТ ---
    async function send(){
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, 'user');
        input.value = '';
        showTyping();

        try{
            const res = await fetch(`${API_BASE}/api/chat`, {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    text: text,
                    history: chatHistory
                })
            });

            const data = await res.json();
            hideTyping();
            if (res.status !== 200){
                addMsg(data.error || 'Ошибка доступа', 'bot');
            } else {
                addMsg(data.answer, 'bot');
                chatHistory.push({ role:'user', content:text });
                chatHistory.push({ role:'assistant', content:data.answer });
            }
        } catch(err){
            hideTyping();
            addMsg('*чертыхнулся* Не могу связаться с сервером.', 'bot');
        }
    }

    function addMsg(text, type){
        const chat = document.getElementById('chat-messages');
        const el = document.createElement('div');
        el.className = `msg msg-${type}`;
        el.innerText = text;
        chat.appendChild(el);
        scrollToBottom();
    }

    function showTyping(){
        const chat = document.getElementById('chat-messages');
        const el = document.createElement('div');
        el.className = 'msg typing';
        el.id = 'typingIndicator';
        el.innerHTML = '<span></span><span></span><span></span>';
        chat.appendChild(el);
        scrollToBottom();
    }
    function hideTyping(){
        document.getElementById('typingIndicator')?.remove();
    }

    function scrollToBottom(){
        const chat = document.getElementById('chat-messages');
        chat.scrollTop = chat.scrollHeight;
    }

    // --- НАСТРОЙКИ / ПРОМПТ ---
    const modal = document.getElementById('prompt-modal');
    const promptInput = document.getElementById('customPromptInput');

    function openPromptModal(){
        promptInput.value = currentCustomPrompt || "";
        modal.classList.add('active');
        promptInput.focus();
    }
    function closePromptModal(){ modal.classList.remove('active'); }

    async function saveCustomPrompt(){
        const newPrompt = promptInput.value.trim();
        if (!newPrompt){
            closePromptModal();
            return;
        }
        try{
            const res = await fetch(`${API_BASE}/api/prompt`, {
                method:'POST',
                headers:{ 'Content-Type':'application/json' },
                body: JSON.stringify({ user_id: userId, prompt: newPrompt })
            });
            const data = await res.json();
            if (res.status !== 200){
                showToast(data.error || 'Не удалось сохранить');
                return;
            }
            currentCustomPrompt = newPrompt;
            updatePromptStatus();
            showToast('Промпт сохранён ✨');
        } catch(err){
            showToast('Нет связи с сервером');
        }
        closePromptModal();
    }

    async function resetPrompt(){
        try{
            const res = await fetch(`${API_BASE}/api/prompt`, {
                method:'DELETE',
                headers:{ 'Content-Type':'application/json' },
                body: JSON.stringify({ user_id: userId })
            });
            if (res.status !== 200){
                const data = await res.json();
                showToast(data.error || 'Не удалось сбросить');
                return;
            }
            currentCustomPrompt = null;
            updatePromptStatus();
            showToast('Возвращён стандарт 🔄');
        } catch(err){
            showToast('Нет связи с сервером');
        }
    }

    // --- TOAST ---
    let toastTimer;
    function showToast(text){
        const toast = document.getElementById('toast');
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }
</script>
</body>
</html>
